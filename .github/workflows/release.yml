name: Build and Release App Bundle

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: |
            storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            storeFile=upload-keystore.jks
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr '+' '-')
            TAG_NAME="v$VERSION"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build/app/outputs/bundle/release/app-release.aab --clobber
          else
            gh release create "$TAG_NAME" build/app/outputs/bundle/release/app-release.aab --title "Release $TAG_NAME" --generate-notes
          fi
